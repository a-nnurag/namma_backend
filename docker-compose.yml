version: "3.9"

services:
  backend:
    build: .
    container_name: nammakelsa-backend
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nammakelsa:secret@postgres:5432/nammakelsa_backend
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    volumes:
      - backend-storage:/tmp/backend
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: nammakelsa-postgres-backend
    environment:
      POSTGRES_USER: nammakelsa
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: nammakelsa_backend
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nammakelsa -d nammakelsa_backend"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nammakelsa-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: nammakelsa-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr 0.0.0.0:8081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:latest
    container_name: nammakelsa-redpanda-console
    ports:
      - "8080:8080"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    volumes:
      - ./redpanda-console-config.yml:/tmp/config.yml:ro
    depends_on:
      - redpanda
    restart: unless-stopped

  ml-service:
    image: nammakelsa-ml:latest
    container_name: nammakelsa-ml-service
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres-data:
  backend-storage:
