[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects $PORT — use it directly so the service binds to the right port
startCommand = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8001} --workers 2 --log-config /dev/null"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
